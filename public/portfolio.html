<style>
  :root{
    --estrategia:#A046C6; --criacao:#F9267C; --tecnologia:#2285FC;
    --tinta:#1E1E1E; --claro:#F4F4F4; --claro-2:#C9C9C9; --claro-3:#8f8f93;
    --borda:rgba(255,255,255,.14); --card:rgba(255,255,255,.05); --card-borda:rgba(255,255,255,.09);
    --espectro:linear-gradient(120deg,#A046C6 0%,#F9267C 52%,#2285FC 100%);
    --display:"Baloo Bhai 2",system-ui,sans-serif;
    --body:"DM Sans",system-ui,sans-serif;
    --maxw:1120px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--tinta);color:var(--claro);font-family:var(--body);
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:28px 24px 72px;}
  a{color:inherit;}
  h1{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.02;
    font-size:clamp(2.2rem,6vw,3.4rem);margin:.1em 0 .12em;}
  .eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--claro-3);font-weight:600;}
  .lead{color:var(--claro-2);max-width:60ch;margin:0;}
  .back{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;
    color:var(--claro-3);text-decoration:none;margin-bottom:22px;}
  .back:hover{color:var(--claro);}

  /* filters */
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 24px;position:sticky;top:0;
    padding:14px 0;background:linear-gradient(var(--tinta),var(--tinta) 70%,transparent);z-index:5;}
  .fchip{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.04em;
    padding:9px 16px;border-radius:999px;border:1px solid var(--borda);background:transparent;
    color:var(--claro-2);cursor:pointer;transition:.15s;}
  .fchip:hover{color:#fff;border-color:var(--claro-3);}
  .fchip.active{color:#fff;border-color:transparent;background:var(--espectro);}
  .fchip:focus-visible{outline:2px solid #fff;outline-offset:3px;}

  /* masonry grid */
  .grid{column-count:3;column-gap:18px;}
  @media(max-width:820px){.grid{column-count:2;}}
  @media(max-width:520px){.grid{column-count:1;}}
  .item{break-inside:avoid;margin:0 0 18px;border:1px solid var(--card-borda);border-radius:16px;
    overflow:hidden;background:var(--card);}
  .item.hide{display:none;}
  .item.wide{column-span:all;}
  .shot{display:block;width:100%;height:auto;cursor:zoom-in;}
  /* placeholder look while no image */
  .ph{display:grid;place-items:center;text-align:center;gap:6px;color:var(--claro-3);
    border-bottom:1px dashed var(--borda);
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 12px,transparent 12px 24px);}
  .ph.r45{aspect-ratio:4/5;} .ph.r11{aspect-ratio:1/1;} .ph.r169{aspect-ratio:16/9;} .ph.r34{aspect-ratio:3/4;}
  .ph .pi{font-size:1.6rem;opacity:.5;}
  .ph .pf{font-size:.72rem;font-family:var(--display);letter-spacing:.04em;}
  .meta{padding:14px 16px;}
  .meta .cli{font-family:var(--display);font-weight:700;font-size:.95rem;}
  .meta .ctx{color:var(--claro-2);font-size:.85rem;margin-top:2px;}
  .catrow{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .cat{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
    padding:3px 8px;border-radius:6px;}
  .c-interna{color:#e5b8f5;background:rgba(160,70,198,.16);}
  .c-linkedin{color:#a9d0ff;background:rgba(34,133,252,.15);}
  .c-instagram{color:#ffb3d1;background:rgba(249,38,124,.15);}
  .metric{font-size:.72rem;color:var(--claro-3);font-weight:600;}

  .empty{color:var(--claro-3);font-size:.85rem;padding:40px 0;text-align:center;display:none;}
  .foot{margin-top:48px;padding-top:22px;border-top:1px solid var(--borda);
    color:var(--claro-3);font-size:.82rem;}
  .foot .sig{font-family:var(--display);font-weight:800;
    background:var(--espectro);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(12,12,12,.94);display:none;z-index:50;
    align-items:center;justify-content:center;}
  .lb.open{display:flex;}
  .lb img{max-width:92vw;max-height:84vh;object-fit:contain;border-radius:8px;
    box-shadow:0 24px 70px rgba(0,0,0,.6);}
  .lb-count{position:fixed;top:18px;left:0;right:0;text-align:center;color:var(--claro-3);
    font-size:.78rem;letter-spacing:.14em;font-weight:600;}
  .lb-cap{position:fixed;left:0;right:0;bottom:22px;text-align:center;color:var(--claro-2);
    font-size:.92rem;padding:0 16px;}
  .lb-cap b{color:#fff;font-family:var(--display);}
  .lb-btn{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;
    border:1px solid var(--borda);background:rgba(255,255,255,.06);color:#fff;font-size:1.7rem;
    line-height:1;cursor:pointer;display:grid;place-items:center;transition:.15s;}
  .lb-btn:hover{background:var(--espectro);border-color:transparent;}
  .lb-prev{left:18px;} .lb-next{right:18px;}
  .lb-close{position:fixed;top:14px;right:16px;width:44px;height:44px;border-radius:50%;
    border:1px solid var(--borda);background:rgba(255,255,255,.06);color:#fff;font-size:1.2rem;
    cursor:pointer;transition:.15s;}
  .lb-close:hover{background:var(--espectro);border-color:transparent;}
  .lb-btn:focus-visible,.lb-close:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  @media(max-width:560px){.lb-btn{width:42px;height:42px;font-size:1.4rem;}
    .lb-prev{left:8px;} .lb-next{right:8px;} .lb img{max-width:96vw;}}
</style>

  const chips=[...document.querySelectorAll('.fchip')];

    let shown=0;
    items.forEach(it=>{
      const ok = f==='all' || it.dataset.cat===f;
      it.classList.toggle('hide',!ok);
      if(ok) shown++;
    });
    empty.style.display = shown? 'none':'block';
  }
  chips.forEach(c=>c.addEventListener('click',()=>{
    chips.forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    apply(c.dataset.filter);
  }));

  /* lightbox */
  const lb=document.getElementById('lb'),
        lbImg=document.getElementById('lbImg'),
        lbCap=document.getElementById('lbCap'),
        lbCount=document.getElementById('lbCount');
  let seq=[], cur=0;
  function visibleImgs(){
    return items.filter(it=>!it.classList.contains('hide'))
                .map(it=>it.querySelector('img.shot'));
  }
  function render(){
    const img=seq[cur], fig=img.closest('.item');
    lbImg.src=img.src; lbImg.alt=img.alt;
    lbCap.innerHTML='<b>'+fig.querySelector('.cli').textContent+'</b> · '+fig.querySelector('.ctx').textContent;
    lbCount.textContent=(cur+1)+' / '+seq.length;
  }
  function open(img){
    seq=visibleImgs(); cur=Math.max(0,seq.indexOf(img)); render();
    lb.classList.add('open'); lb.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
  }
  function move(d){ cur=(cur+d+seq.length)%seq.length; render(); }
  function close(){ lb.classList.remove('open'); lb.setAttribute('aria-hidden','true');
    document.body.style.overflow=''; }
  items.forEach(it=>it.querySelector('img.shot').addEventListener('click',e=>open(e.currentTarget)));
  document.getElementById('lbPrev').addEventListener('click',e=>{e.stopPropagation();move(-1);});
  document.getElementById('lbNext').addEventListener('click',e=>{e.stopPropagation();move(1);});
  document.getElementById('lbClose').addEventListener('click',close);
  lb.addEventListener('click',e=>{ if(e.target===lb) close(); });
  document.addEventListener('keydown',e=>{
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') close();
    else if(e.key==='ArrowLeft') move(-1);
    else if(e.key==='ArrowRight') move(1);
  });
</script>
